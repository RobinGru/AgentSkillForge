name: Verify release version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example v0.5.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify package, skill, and tag versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"
