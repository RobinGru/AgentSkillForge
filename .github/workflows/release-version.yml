name: Verify release version

on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example 0.5.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify package, skill, and tag versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"
