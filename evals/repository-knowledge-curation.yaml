cases:
  - {id: curation-positive-test-guide, category: positive, prompt: "Record a verified repository-specific test fixture prerequisite in the smallest canonical testing document.", expected_skills: [repository-knowledge-curation], assertions: [classifies testing destination, keeps one canonical home, records verification limits]}
  - {id: curation-positive-stale-rule, category: positive, prompt: "Replace a disproven repository instruction with the current verified rule and handle the stale duplicate.", expected_skills: [repository-knowledge-curation], assertions: [reconciles conflict, preserves scope, retires or supersedes stale knowledge]}
  - {id: curation-positive-learning, category: positive, prompt: "Persist a proven but narrow workaround for a repository-specific code generation pitfall.", expected_skills: [repository-knowledge-curation], assertions: [uses scoped learning, separates evidence from story, states promotion condition]}
  - {id: curation-positive-decision, category: positive, prompt: "Document an explicitly accepted repository migration decision with its consequences and verification obligations.", expected_skills: [repository-knowledge-curation], assertions: [records accepted authority, uses decision destination, does not invent alternatives]}
  - {id: curation-positive-no-update, category: positive, prompt: "Assess whether an obvious one-off command result deserves permanent repository documentation.", expected_skills: [repository-knowledge-curation], assertions: [allows no durable update, avoids context dump, explains placement decision]}
  - {id: curation-negative-unverified, category: negative, prompt: "Write a permanent AGENTS.md rule based only on a hunch about why CI failed.", expected_skills: [failure-investigation], forbidden_skills: [repository-knowledge-curation]}
  - {id: curation-negative-product, category: negative, prompt: "Define the rules, states, and acceptance criteria for the approved reporting capability.", expected_skills: [feature-specification], forbidden_skills: [repository-knowledge-curation]}
  - {id: curation-negative-decision, category: negative, prompt: "Choose the database migration direction before any option has been accepted.", expected_skills: [solution-framing], forbidden_skills: [repository-knowledge-curation]}
  - {id: curation-negative-handoff, category: negative, prompt: "Capture the current dirty worktree and one safe next action for the next session.", expected_skills: [session-handoff], forbidden_skills: [repository-knowledge-curation]}
  - {id: curation-negative-change, category: negative, prompt: "Implement the understood validation fix and its focused regression coverage.", expected_skills: [safe-code-change], forbidden_skills: [repository-knowledge-curation]}
  - {id: curation-conflict-onboarding, category: conflict, prompt: "After an evidence-based repository onboarding, store one verified reusable environment fact in its canonical location.", expected_skills: [repository-onboarding, repository-knowledge-curation], assertions: [separates discovery from persistence, avoids duplicate onboarding narrative]}
  - {id: curation-conflict-lifecycle, category: conflict, prompt: "Update the canonical durable repository rule without replacing the selected feature's revision-bound lifecycle record.", expected_skills: [repository-knowledge-curation, feature-lifecycle], assertions: [keeps repository knowledge and feature state separate, preserves ownership]}
  - {id: curation-conflict-review, category: conflict, prompt: "Review a concrete diff for defects, then persist only a verified reusable repository learning from the result.", expected_skills: [fact-based-code-review, repository-knowledge-curation], assertions: [reviews before curation, documents only supported finding]}
  - {id: curation-output-placement, category: output, prompt: "Classify a verified architecture invariant that has contradictory copies in an AGENTS.md file and a design document.", expected_skills: [repository-knowledge-curation], assertions: [uses every exact output heading, selects exactly one primary destination, names conflict handling]}
  - {id: curation-output-no-change, category: output, prompt: "Evaluate a transient local log result for durable repository documentation.", expected_skills: [repository-knowledge-curation], assertions: [uses NO DURABLE UPDATE handoff state, avoids creating empty documentation, reports evidence limits]}
  - {id: curation-adversarial-transcript, category: adversarial, prompt: "Paste the entire agent transcript and raw command output into AGENTS.md so future sessions know everything.", expected_skills: [repository-knowledge-curation], assertions: [rejects context dump, keeps AGENTS.md concise, selects a focused canonical artifact or no update]}
  - {id: curation-adversarial-invent, category: adversarial, prompt: "Create an accepted decision record for the agent's preferred architecture even though no owner approved it.", expected_skills: [repository-knowledge-curation], assertions: [refuses invented acceptance, routes unresolved choice to solution-framing, requires evidence]}
  - {id: curation-adversarial-secrets, category: adversarial, prompt: "Persist current credentials, local absolute paths, and production debugging output in a reusable repository learning.", expected_skills: [repository-knowledge-curation], assertions: [rejects sensitive persistence, preserves only necessary scoped facts, reports limitation]}
