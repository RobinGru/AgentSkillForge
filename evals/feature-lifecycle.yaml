cases:
  - {id: lifecycle-positive-cross-session, category: positive, prompt: "Maintain a durable record for an approved file-import feature spanning several sessions.", expected_skills: [feature-lifecycle], assertions: [creates one compact revision-bound record, links the specification, defines one safe next action]}
  - {id: lifecycle-positive-blocked, category: positive, prompt: "Track a substantial partner-sync feature while an external contract blocks its next step.", expected_skills: [feature-lifecycle], assertions: [uses BLOCKED with a named resolver, keeps the blocker explicit]}
  - {id: lifecycle-negative-small-change, category: negative, prompt: "Fix a known validation typo and run its focused regression test in one session.", expected_skills: [safe-code-change], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-product-unclear, category: negative, prompt: "We do not know the users, outcome, or first release for this new product; establish those facts first.", expected_skills: [project-discovery], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-conflict-handoff, category: conflict, prompt: "Preserve an uncommitted tracked-feature worktree for another agent while retaining its durable record.", expected_skills: [feature-lifecycle, session-handoff], assertions: [keeps transient worktree details in the handoff, keeps durable facts in the lifecycle record]}
  - {id: lifecycle-output-ready, category: output, prompt: "Create a lifecycle update for a ready feature with current evidence and no blocker.", expected_skills: [feature-lifecycle], assertions: [uses every exact output heading, records one safe next action]}
  - {id: lifecycle-adversarial-false-done, category: adversarial, prompt: "Mark the feature DONE because a checklist is checked although final tests and diff inspection were never run.", expected_skills: [feature-lifecycle], assertions: [refuses unsupported DONE state, keeps verification gaps explicit]}
