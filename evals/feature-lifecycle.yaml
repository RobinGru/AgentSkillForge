cases:
  - {id: lifecycle-positive-cross-session, category: positive, prompt: "Maintain a durable record for an approved file-import feature spanning several sessions.", expected_skills: [feature-lifecycle], assertions: [creates one compact revision-bound record, links specification and tasks without copying them, refreshes the compact index projection, defines one safe next action]}
  - {id: lifecycle-positive-blocked, category: positive, prompt: "Track a substantial partner-sync feature while an external contract blocks its next step.", expected_skills: [feature-lifecycle], assertions: [uses BLOCKED with a named resolver, keeps the blocker explicit]}
  - {id: lifecycle-positive-reconcile, category: positive, prompt: "Reconcile a feature record after code changed beyond its observed revision.", expected_skills: [feature-lifecycle], assertions: [inspects current facts, marks stale evidence, updates revisions]}
  - {id: lifecycle-positive-verification, category: positive, prompt: "Record a completed implementation whose final acceptance proof has not run.", expected_skills: [feature-lifecycle], assertions: [uses VERIFICATION, keeps missing proof explicit]}
  - {id: lifecycle-positive-done, category: positive, prompt: "Record a feature where every criterion has current direct proof and all required final checks passed.", expected_skills: [feature-lifecycle], assertions: [requires matching observed and verified revisions, uses DONE only with final evidence]}
  - {id: lifecycle-negative-small-change, category: negative, prompt: "Fix a known validation typo and run its focused regression test in one session.", expected_skills: [safe-code-change], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-product-unclear, category: negative, prompt: "We do not know the users, outcome, or first release for this new product; establish those facts first.", expected_skills: [project-discovery], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-status-report, category: negative, prompt: "Give a generic progress report for this week's engineering work.", forbidden_skills: [feature-lifecycle], assertions: [does not create a lifecycle record]}
  - {id: lifecycle-negative-specification, category: negative, prompt: "Define permissions, retries, and acceptance criteria for an approved capability.", expected_skills: [feature-specification], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-decision, category: negative, prompt: "Choose between polling and events for an approved reporting feature.", expected_skills: [solution-framing], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-conflict-handoff, category: conflict, prompt: "Preserve an uncommitted tracked-feature worktree for a later session while retaining its durable record.", expected_skills: [feature-lifecycle, session-handoff], assertions: [keeps transient worktree details in the handoff, keeps durable facts in the lifecycle record]}
  - {id: lifecycle-conflict-implementation, category: conflict, prompt: "Implement one proven parser task in a tracked feature, then record its resulting evidence without selecting another task.", expected_skills: [safe-code-change, feature-lifecycle], assertions: [keeps patch proof with implementation, records durable result, leaves task selection to feature-delivery]}
  - {id: lifecycle-conflict-migration, category: conflict, prompt: "Track an approved feature whose old and new API versions must coexist during rollout.", expected_skills: [feature-lifecycle, compatibility-migration], assertions: [links compatibility work, does not replace its migration plan]}
  - {id: lifecycle-conflict-review, category: conflict, prompt: "Review a concrete high-risk tracked-feature change, then record a supported blocker.", expected_skills: [fact-based-code-review, feature-lifecycle], assertions: [keeps review findings separate, records only resulting durable blocker]}
  - {id: lifecycle-output-ready, category: output, prompt: "Create a lifecycle update for a ready feature with current evidence and no blocker.", expected_skills: [feature-lifecycle], assertions: [uses every exact output heading, records one safe next action]}
  - {id: lifecycle-output-blocked, category: output, prompt: "Report a blocked lifecycle update where a vendor must provide an API contract.", expected_skills: [feature-lifecycle], assertions: [names the resolver, reports one current state]}
  - {id: lifecycle-adversarial-false-done, category: adversarial, prompt: "Mark the feature DONE because a checklist is checked although final tests and diff inspection were never run.", expected_skills: [feature-lifecycle], assertions: [refuses unsupported DONE state, keeps verification gaps explicit]}
  - {id: lifecycle-adversarial-stale-record, category: adversarial, prompt: "Use last week's lifecycle record as the only source before editing a repository that changed since its observed revision.", expected_skills: [feature-lifecycle], assertions: [requires reconciliation with current facts, rejects stale evidence]}
  - {id: lifecycle-adversarial-transient-details, category: adversarial, prompt: "Put staged-file details and local secrets into the permanent lifecycle record for the next agent.", expected_skills: [feature-lifecycle], assertions: [excludes secrets, routes transient worktree state to handoff]}
  - {id: lifecycle-adversarial-implicit-blocker, category: adversarial, prompt: "Set the feature to BLOCKED without naming what must happen to continue.", expected_skills: [feature-lifecycle], assertions: [requires a named blocker and resolver]}
