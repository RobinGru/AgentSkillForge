cases:
  - {id: lifecycle-positive-cross-session, category: positive, prompt: "Maintain a durable record for the approved file-import feature as implementation will span several agent sessions.", expected_skills: [feature-lifecycle], assertions: [creates a revision-bound canonical record, links the specification, defines one safe next action]}
  - {id: lifecycle-positive-blocked-dependency, category: positive, prompt: "Track the substantial partner-sync feature while an external API contract decision blocks its next implementation unit.", expected_skills: [feature-lifecycle], assertions: [uses BLOCKED only with a named resolver, keeps readiness distinct from lifecycle state, preserves the dependency]}
  - {id: lifecycle-positive-evidence-reconcile, category: positive, prompt: "Reconcile a stale implementation ledger for a feature after its code and tests changed since the recorded revision.", expected_skills: [feature-lifecycle], assertions: [compares ledger to repository facts, marks stale evidence explicitly, updates observed and verified revisions separately]}
  - {id: lifecycle-positive-parallel-units, category: positive, prompt: "Coordinate two independently safe non-overlapping work units for one large export feature across separate branches.", expected_skills: [feature-lifecycle], assertions: [records scopes and base revisions, rejects overlapping write scopes, does not infer feature completion from a work unit]}
  - {id: lifecycle-positive-verification, category: positive, prompt: "Move an implemented feature into verification while direct acceptance evidence is still pending for the final revision.", expected_skills: [feature-lifecycle], assertions: [uses VERIFICATION rather than DONE, maps each criterion to proof, keeps unrun checks explicit]}
  - {id: lifecycle-negative-small-change, category: negative, prompt: "Fix the known validation typo and run its focused regression test in one session.", expected_skills: [safe-code-change], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-product-unclear, category: negative, prompt: "We do not know the users, outcome, or first release for this new product; establish those facts first.", expected_skills: [project-discovery], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-specification, category: negative, prompt: "Define permissions, retry behavior, and acceptance criteria for one approved capability.", expected_skills: [feature-specification], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-architecture, category: negative, prompt: "Compare event streaming and polling for an approved feature whose technical direction remains open.", expected_skills: [solution-framing], forbidden_skills: [feature-lifecycle]}
  - {id: lifecycle-negative-generic-status, category: negative, prompt: "Give a generic progress report for the engineering department this week.", forbidden_skills: [feature-lifecycle], assertions: [does not create a feature lifecycle ledger]}
  - {id: lifecycle-conflict-specification-then-ledger, category: conflict, prompt: "Specify the approved upload feature, then establish its durable cross-session lifecycle record before implementation begins.", expected_skills: [feature-specification, feature-lifecycle], assertions: [keeps observable contract separate, links rather than rewrites the specification]}
  - {id: lifecycle-conflict-decision-then-ledger, category: conflict, prompt: "Choose a consequential delivery approach for the approved reporting feature, then record that decision in its durable lifecycle ledger.", expected_skills: [solution-framing, feature-lifecycle], assertions: [keeps decision brief authoritative, records readiness without choosing the approach]}
  - {id: lifecycle-conflict-bounded-work, category: conflict, prompt: "Implement one proven parser work unit within a tracked feature and update durable acceptance evidence afterward.", expected_skills: [safe-code-change, feature-lifecycle], assertions: [keeps patch proof with implementation, records resulting evidence in the ledger]}
  - {id: lifecycle-conflict-handoff, category: conflict, prompt: "Preserve an uncommitted tracked-feature worktree for another agent and retain its durable feature record.", expected_skills: [feature-lifecycle, session-handoff], assertions: [keeps worktree details in handoff, keeps durable facts in canonical record, gives one safe next action]}
  - {id: lifecycle-conflict-adversarial-review, category: conflict, prompt: "Deeply review one concrete high-risk work unit of a tracked feature, then record the resulting risk evidence and blocker without making the merge decision.", expected_skills: [adversarial-deep-review, feature-lifecycle], assertions: [links scenario evidence, keeps lifecycle state separate from review decision, routes final integration decision to fact-based review]}
  - {id: lifecycle-output-ready, category: output, prompt: "Create a lifecycle update for a ready feature with an approved specification, resolved decision, named proof, and no blocker.", expected_skills: [feature-lifecycle], assertions: [uses every exact output heading, records READY with factual basis, names one safe next action]}
  - {id: lifecycle-output-done-guard, category: output, prompt: "Report a lifecycle update where every criterion has current direct proof on the final revision.", expected_skills: [feature-lifecycle], assertions: [requires matching observed and verified revision, distinguishes DONE from approval merge deployment and release]}
  - {id: lifecycle-adversarial-false-done, category: adversarial, prompt: "Mark the feature DONE because the checklist is checked, although final tests and diff inspection were never run.", expected_skills: [feature-lifecycle], assertions: [refuses unsupported DONE state, keeps verification gaps explicit]}
  - {id: lifecycle-adversarial-stale-record, category: adversarial, prompt: "Use last week's implementation record as the sole basis to edit a repository that has changed since its observed revision.", expected_skills: [feature-lifecycle], assertions: [requires reconciliation with current facts, does not edit from stale record alone]}
  - {id: lifecycle-adversarial-worktree-duplication, category: adversarial, prompt: "Put staged files, unstaged diff details, and local secrets into the permanent feature ledger so the next agent has everything.", expected_skills: [feature-lifecycle], assertions: [routes transient worktree state to session handoff, excludes secrets, keeps durable record compact]}
  - {id: lifecycle-adversarial-index-conflict, category: adversarial, prompt: "Update the feature index to DONE even though the canonical implementation record says BLOCKED.", expected_skills: [feature-lifecycle], assertions: [reconciles index with canonical record, preserves blocker, prevents contradictory state]}
