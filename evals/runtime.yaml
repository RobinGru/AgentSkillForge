version: 1
cases:
  - id: safe-code-change-contract
    prompt: Fix a reproducible validation bug without changing unrelated behavior.
    expected_skills: [safe-code-change]
    expect:
      required_patterns:
        - "(?i)behavior contract"
        - "(?i)(verification|proof|test)"
      prohibited_patterns:
        - "(?i)tests? passed"

  - id: product-interface-engineering-contract
    prompt: Bau mir ein Login-Modal mit Validierung und Fehlerzuständen.
    expected_skills: [product-interface-engineering]
    expect:
      required_patterns:
        - "(?i)scope"
        - "(?i)(interaction|state|validation|error)"
      prohibited_patterns:
        - "(?i)tests? passed"

  - id: performance-investigation-contract
    prompt: Investigate a measured p95 API latency regression after a release.
    expected_skills: [performance-investigation]
    forbidden_skills: [safe-code-change]
    expect:
      required_patterns:
        - "(?i)baseline"
        - "(?i)(hypoth|experiment)"
      prohibited_patterns:
        - "(?i)(fixed|optimized) the endpoint"

  - id: fact-based-review-contract
    prompt: Review the supplied authorization diff before merge.
    expected_skills: [fact-based-code-review]
    expect:
      required_patterns:
        - "(?i)(finding|evidence|fact)"
        - "(?i)(verification|test|gap)"
      prohibited_patterns:
        - "(?i)approved without"

  - id: security-boundary-contract
    prompt: Threat-model the privilege transition for delegated administration.
    expected_skills: [security-boundary-analysis]
    expect:
      required_patterns:
        - "(?i)(trust boundary|trust transition)"
        - "(?i)(abuse path|threat)"
      prohibited_patterns:
        - "(?i)tests? passed"

  - id: feature-lifecycle-contract
    prompt: Reconcile a durable multi-session feature ledger with the current revision and state its one safe next action.
    expected_skills: [feature-lifecycle]
    expect:
      required_patterns:
        - "(?i)(observed revision|verified revision)"
        - "(?i)canonical (record|implementation)"
        - "(?i)(next safe action|safe next action)"
      prohibited_patterns:
        - "(?i)tests? passed"

  - id: repository-onboarding-contract
    prompt: Build an evidence-based technical working map for an unfamiliar repository before substantial work.
    expected_skills: [repository-onboarding]
    expect:
      required_patterns:
        - "(?i)(repository identity|structure and boundaries)"
        - "(?i)(discovered|executed|blocked|stale)"
        - "(?i)(verification model|verification)"
      prohibited_patterns:
        - "(?i)tests? passed"

  - id: repository-knowledge-curation-contract
    prompt: Persist a verified reusable repository fact in the smallest canonical durable artifact.
    expected_skills: [repository-knowledge-curation]
    expect:
      required_patterns:
        - "(?i)(knowledge candidate|placement decision)"
        - "(?i)canonical"
        - "(?i)(evidence|verification)"
      prohibited_patterns:
        - "(?i)tests? passed"
