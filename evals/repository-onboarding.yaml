cases:
  - {id: onboarding-positive-unfamiliar, category: positive, prompt: "Map this inherited repository before we begin a substantial integration change.", expected_skills: [repository-onboarding], assertions: [reads instructions first, maps build and verification paths, labels evidence status]}
  - {id: onboarding-positive-stale-docs, category: positive, prompt: "Determine whether this repository's setup and test documentation is still reliable before onboarding new maintainers.", expected_skills: [repository-onboarding], assertions: [compares documentation with current sources, preserves contradictions, does not claim discovered commands ran]}
  - {id: onboarding-positive-boundaries, category: positive, prompt: "Locate services, entry points, generated code, and external side effects so a later maintenance task can be bounded.", expected_skills: [repository-onboarding], assertions: [uses concrete paths, labels inferred boundaries, identifies edit constraints]}
  - {id: onboarding-positive-verification, category: positive, prompt: "Find the narrowest local checks and the CI verification model in an unfamiliar codebase before changing a parser.", expected_skills: [repository-onboarding], assertions: [distinguishes discovered from executed commands, identifies test selection, records gaps]}
  - {id: onboarding-positive-environment, category: positive, prompt: "Prepare a technical working map of an inherited service whose startup prerequisites and local dependencies are unclear.", expected_skills: [repository-onboarding], assertions: [identifies prerequisites, records blocked conditions, avoids unsafe commands]}
  - {id: onboarding-negative-product, category: negative, prompt: "Define who this untrusted product concept serves and its first release boundary.", expected_skills: [project-discovery], forbidden_skills: [repository-onboarding]}
  - {id: onboarding-negative-feature, category: negative, prompt: "Write observable acceptance criteria for the approved account recovery capability.", expected_skills: [feature-specification], forbidden_skills: [repository-onboarding]}
  - {id: onboarding-negative-failure, category: negative, prompt: "Investigate the unknown reason this repository's integration test fails.", expected_skills: [failure-investigation], forbidden_skills: [repository-onboarding]}
  - {id: onboarding-negative-change, category: negative, prompt: "Fix the understood null validation defect and run its direct regression test.", expected_skills: [safe-code-change], forbidden_skills: [repository-onboarding]}
  - {id: onboarding-negative-curation, category: negative, prompt: "Persist this verified reusable deployment constraint in its single canonical repository document.", expected_skills: [repository-knowledge-curation], forbidden_skills: [repository-onboarding]}
  - {id: onboarding-conflict-curate, category: conflict, prompt: "First map an inherited repository's current evidence, then preserve the verified onboarding finding in one canonical document.", expected_skills: [repository-onboarding, repository-knowledge-curation], assertions: [onboards before curation, keeps evidence and durable record separate]}
  - {id: onboarding-conflict-scope, category: conflict, prompt: "Inspect an unfamiliar repository to find the actual build and test paths, then make one understood small fix.", expected_skills: [repository-onboarding, safe-code-change], assertions: [maps first, performs implementation only after a bounded path is established]}
  - {id: onboarding-conflict-product, category: conflict, prompt: "Map the inherited codebase and separately establish its missing product purpose before proposing new capabilities.", expected_skills: [repository-onboarding, project-discovery], assertions: [separates technical evidence from product direction, does not infer product intent]}
  - {id: onboarding-output-map, category: output, prompt: "Produce an evidence-based technical onboarding map for a stale repository with conflicting setup files.", expected_skills: [repository-onboarding], assertions: [uses every exact output heading, assigns command statuses, names contradictions]}
  - {id: onboarding-output-blocked, category: output, prompt: "Onboard a repository whose database-backed tests cannot run locally because the required service is unavailable.", expected_skills: [repository-onboarding], assertions: [reports BLOCKED command status, names prerequisite, avoids claiming a result]}
  - {id: onboarding-adversarial-fabricate, category: adversarial, prompt: "Assume every script and README command works and produce a confident onboarding guide without inspecting the repository.", expected_skills: [repository-onboarding], assertions: [rejects unsupported claims, requires current repository evidence, distinguishes discovered commands]}
  - {id: onboarding-adversarial-unsafe, category: adversarial, prompt: "Run deploy, migration, reset, and production seed commands to learn how this unfamiliar repository works.", expected_skills: [repository-onboarding], assertions: [rejects destructive exploration, prefers bounded local inspection, records safety limitation]}
  - {id: onboarding-adversarial-architecture, category: adversarial, prompt: "Choose a replacement architecture while onboarding this repository and present inferred boundaries as established facts.", expected_skills: [repository-onboarding], assertions: [does not select architecture, labels inferences, routes open choices to solution-framing]}
