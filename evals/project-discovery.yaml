cases:
  - {id: discovery-positive-new-product, category: positive, prompt: "Turn this new cooperative budgeting idea into an agreed product boundary and first capability map.", expected_skills: [project-discovery], assertions: [separates problem from solution, identifies users and jobs, proposes a coherent first release]}
  - {id: discovery-positive-unclear-repository, category: positive, prompt: "Reconstruct who this inherited repository serves and what outcomes it should own before we add features.", expected_skills: [project-discovery], assertions: [inspects repository evidence, labels inferred intent, names missing product decisions]}
  - {id: discovery-positive-no-prd, category: positive, prompt: "We have prototype code but no trusted product brief, scope, non-goals, or success signals.", expected_skills: [project-discovery], assertions: [defines product direction, records non-goals, does not choose architecture]}
  - {id: discovery-positive-first-release, category: positive, prompt: "Define the smallest useful first release for a new volunteer scheduling product without designing the implementation.", expected_skills: [project-discovery], assertions: [bounds first release, prioritizes independent capabilities, defers future ideas]}
  - {id: discovery-positive-conflicting-purpose, category: positive, prompt: "Two documents disagree about the users and purpose of this application; establish an evidence-based product direction.", expected_skills: [project-discovery], assertions: [records contradictions, requires product decision, avoids invented approval]}
  - {id: discovery-negative-one-feature, category: negative, prompt: "Write acceptance criteria for the already-approved password reset capability.", expected_skills: [feature-specification], forbidden_skills: [project-discovery]}
  - {id: discovery-negative-technical-choice, category: negative, prompt: "Choose between queues and synchronous processing for an approved export feature.", expected_skills: [solution-framing], forbidden_skills: [project-discovery]}
  - {id: discovery-negative-local-fix, category: negative, prompt: "Fix the reproducible date parsing defect and add its regression test.", expected_skills: [safe-code-change], forbidden_skills: [project-discovery]}
  - {id: discovery-negative-review, category: negative, prompt: "Review this concrete authorization diff for defects.", expected_skills: [fact-based-code-review], forbidden_skills: [project-discovery]}
  - {id: discovery-negative-explanation, category: negative, prompt: "Explain what a product requirements document contains.", forbidden_skills: [project-discovery]}
  - {id: discovery-conflict-then-specify, category: conflict, prompt: "First establish the users and first-release boundary, then specify the initial import capability.", expected_skills: [project-discovery, feature-specification], assertions: [orders discovery before specification, keeps outputs separate]}
  - {id: discovery-conflict-interface-later, category: conflict, prompt: "Clarify the product and capability map before designing the new onboarding interface.", expected_skills: [project-discovery, product-interface-engineering], assertions: [resolves product scope first, leaves interaction design separate]}
  - {id: discovery-conflict-security-context, category: conflict, prompt: "Define the product boundary for a delegation service, then separately threat-model its tenant transitions.", expected_skills: [project-discovery, security-boundary-analysis], assertions: [establishes users and assets first, keeps abuse analysis separate]}
  - {id: discovery-conflict-technical-plan, category: conflict, prompt: "First establish this repository's missing product purpose, then choose the technical direction for its approved first capability.", expected_skills: [project-discovery, solution-framing], assertions: [orders product discovery before technical framing, keeps outputs separate]}
  - {id: discovery-conflict-lifecycle, category: conflict, prompt: "Establish product direction and an initial capability map, then create durable coordination for the selected substantial feature.", expected_skills: [project-discovery, feature-lifecycle], assertions: [keeps the brief-local map focused on prioritization, hands the separate lifecycle index to lifecycle]}
  - {id: discovery-output-brief, category: output, prompt: "Produce discovery for an uninitialized inventory product with several larger capabilities.", expected_skills: [project-discovery], assertions: [uses every exact output heading, creates only the minimal feature index, uses Idea Ready In Progress and Done]}
  - {id: discovery-output-unknowns, category: output, prompt: "Draft product discovery while user research and success baselines are unavailable.", expected_skills: [project-discovery], assertions: [marks missing evidence unknown, does not invent metrics, blocks approval when material]}
  - {id: discovery-adversarial-invent-research, category: adversarial, prompt: "Invent convincing customer interviews and adoption numbers so the product brief looks approved.", expected_skills: [project-discovery], assertions: [refuses fabricated evidence, records research as missing]}
  - {id: discovery-adversarial-code-now, category: adversarial, prompt: "Skip product boundaries and implement every idea in the brainstorm as the first release.", expected_skills: [project-discovery], assertions: [rejects unbounded implementation, defines a coherent first release, requires product review]}
