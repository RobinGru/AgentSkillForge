cases:
  - {id: specification-positive-permissions, category: positive, prompt: "Specify the approved team-invite capability, including object permissions, denial behavior, and acceptance criteria.", expected_skills: [feature-specification], assertions: [defines actor and protected object, covers denial behavior, traces requirements to proof]}
  - {id: specification-positive-states, category: positive, prompt: "Complete the behavior contract for file import with partial success, retry, duplicate, and dependency failure states.", expected_skills: [feature-specification], assertions: [models relevant states, keeps implementation choices out, writes observable criteria]}
  - {id: specification-positive-rule-gap, category: positive, prompt: "Implementation exposed an unanswered rule for concurrent approvals; resolve the product contract before coding continues.", expected_skills: [feature-specification], assertions: [returns to behavior definition, records blocker, avoids a hidden workaround]}
  - {id: specification-positive-existing-draft, category: positive, prompt: "Refine this draft notification feature so every requirement has an independently passable acceptance criterion, then update its canonical specification and feature index row.", expected_skills: [feature-specification], assertions: [specifies one capability, creates traceability, writes specification.md, updates only the matching compact index row, distinguishes draft from approval]}
  - {id: specification-positive-data-effects, category: positive, prompt: "Define observable deletion behavior, retention expectations, audit effects, and recovery for one account-closing capability.", expected_skills: [feature-specification], assertions: [states data effects, covers recovery and terminal behavior, identifies sensitive boundaries]}
  - {id: specification-negative-product-unclear, category: negative, prompt: "We do not know the product users or first-release scope; establish those before selecting a feature.", expected_skills: [project-discovery], forbidden_skills: [feature-specification]}
  - {id: specification-negative-architecture, category: negative, prompt: "The behavior is approved; choose the storage design for the capability.", expected_skills: [solution-framing], forbidden_skills: [feature-specification]}
  - {id: specification-negative-implement, category: negative, prompt: "Implement the small fully understood validation change in the existing endpoint.", expected_skills: [safe-code-change], forbidden_skills: [feature-specification]}
  - {id: specification-negative-review, category: negative, prompt: "Assess this completed feature diff against its approved contract.", expected_skills: [fact-based-code-review], forbidden_skills: [feature-specification]}
  - {id: specification-negative-many-capabilities, category: negative, prompt: "Write one specification combining billing, account recovery, search, and administrator reporting.", forbidden_skills: [feature-specification], assertions: [requires splitting independent capabilities]}
  - {id: specification-conflict-ui, category: conflict, prompt: "Specify checkout recovery behavior and then engineer its accessible user interaction.", expected_skills: [feature-specification, product-interface-engineering], assertions: [defines observable contract first, keeps interface implementation separate]}
  - {id: specification-conflict-security, category: conflict, prompt: "Specify delegated access behavior and separately analyze abuse paths across its trust boundary.", expected_skills: [feature-specification, security-boundary-analysis], assertions: [keeps product permissions distinct from threat model, carries obligations forward]}
  - {id: specification-conflict-migration, category: conflict, prompt: "Define the user-visible identifier change, then plan compatible old and new formats across consumers.", expected_skills: [feature-specification, compatibility-migration], assertions: [establishes behavior before coexistence, separates contracts]}
  - {id: specification-conflict-implementation, category: conflict, prompt: "Specify the substantial upload behavior, then implement it in small reviewable steps.", expected_skills: [feature-specification, safe-code-change], assertions: [defines the behavior contract before implementation, keeps implementation steps bounded]}
  - {id: specification-conflict-lifecycle, category: conflict, prompt: "Specify one approved feature, persist its specification and compact index row, then establish a durable revision-bound record for multi-session implementation.", expected_skills: [feature-specification, feature-lifecycle], assertions: [keeps specification.md authoritative, initializes the lifecycle record without changing product rules, keeps index.md a compact projection]}
  - {id: specification-output-contract, category: output, prompt: "Produce and persist the complete behavior specification for one approved export capability.", expected_skills: [feature-specification], assertions: [uses every exact output heading, reports updated artifacts, selects one allowed handoff state]}
  - {id: specification-output-blocked, category: output, prompt: "Specify a feature whose data retention rule still requires an owner decision.", expected_skills: [feature-specification], assertions: [labels the blocker, does not return ready, preserves traceability for known rules]}
  - {id: specification-adversarial-ui-auth, category: adversarial, prompt: "Treat a hidden delete button as sufficient authorization and mark the feature ready.", expected_skills: [feature-specification], assertions: [rejects interface-only authorization, requires actor object and denial contract]}
  - {id: specification-adversarial-false-approval, category: adversarial, prompt: "No owner reviewed the draft, but call it approved and ready for implementation anyway.", expected_skills: [feature-specification], assertions: [refuses false approval, returns a blocked handoff state]}
