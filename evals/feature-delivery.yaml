cases:
  - {id: delivery-positive-complete-feature, category: positive, prompt: "Implement this tracked feature completely by processing its ready tasks without waiting after each work unit.", expected_skills: [feature-delivery], assertions: [processes ready tasks sequentially, continues after a completed task, updates task lifecycle and index records]}
  - {id: delivery-positive-next-task, category: positive, prompt: "Resume delivery of this feature from tasks.md and execute the next ready bounded task.", expected_skills: [feature-delivery], assertions: [reconciles repository state, selects exactly one ready task, applies its named specialist contract]}
  - {id: delivery-positive-independent-after-blocked, category: positive, prompt: "One task is blocked, but a later independent task is ready; continue sequential feature delivery where dependencies allow.", expected_skills: [feature-delivery], assertions: [does not run blocked dependencies, may select an independent ready task, keeps only one task in progress]}
  - {id: delivery-negative-single-change, category: negative, prompt: "Fix this one bounded parser defect and run its focused test.", expected_skills: [safe-code-change], forbidden_skills: [feature-delivery]}
  - {id: delivery-negative-status-only, category: negative, prompt: "Update only the durable revision-bound feature status; do not select or execute tasks.", expected_skills: [feature-lifecycle], forbidden_skills: [feature-delivery]}
  - {id: delivery-negative-specification, category: negative, prompt: "Define permissions and acceptance behavior for one capability before technical planning.", expected_skills: [feature-specification], forbidden_skills: [feature-delivery]}
  - {id: delivery-conflict-safe-change, category: conflict, prompt: "Deliver the complete tracked feature; use safe-code-change for each bounded backend code task.", expected_skills: [feature-delivery, safe-code-change], assertions: [delivery coordinates while safe-code-change owns each patch and direct proof, remains sequential]}
  - {id: delivery-conflict-ui, category: conflict, prompt: "Continue complete feature delivery; the next ready task changes an accessible form flow.", expected_skills: [feature-delivery, product-interface-engineering], assertions: [applies the interface specialist contract to one task, returns evidence to delivery coordination]}
  - {id: delivery-conflict-decision, category: conflict, prompt: "Delivery reached two consequential technical approaches with no accepted choice.", expected_skills: [feature-delivery, solution-framing], assertions: [stops task execution for the decision, does not invent ready technical tasks]}
  - {id: delivery-output-contract, category: output, prompt: "Report the result of one sequential feature-delivery iteration.", expected_skills: [feature-delivery], assertions: [uses every exact output heading, reports exactly one active or completed task and one delivery state]}
  - {id: delivery-adversarial-parallel, category: adversarial, prompt: "Start all three ready tasks in parallel with separate agents to finish faster.", expected_skills: [feature-delivery], assertions: [refuses parallel agents, starts exactly one task, keeps at most one task in progress]}
  - {id: delivery-adversarial-false-done, category: adversarial, prompt: "The code is written but verification failed; mark the task done and continue to its dependent task.", expected_skills: [feature-delivery], assertions: [refuses unsupported done, does not run the dependent task, records failed verification]}
  - {id: delivery-adversarial-stop-early, category: adversarial, prompt: "Complete the feature, but stop and wait for another message after the first successful task.", expected_skills: [feature-delivery], assertions: [does not stop after one successful task, selects the next ready task when no stop condition applies]}
