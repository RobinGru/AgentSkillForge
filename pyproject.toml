[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-forge"
version = "0.6.5"
description = "Portable, independently authored agent skills"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["evals"]

[tool.setuptools]
py-modules = []

[tool.setuptools.data-files]
"share/agent-skill-forge" = ["README.md", "THIRD_PARTY_NOTICES.md", "docs/compatibility.md"]
"share/agent-skill-forge/clients/codex" = ["docs/clients/codex.md"]
"share/agent-skill-forge/clients/zed" = ["docs/clients/zed.md"]
"share/agent-skill-forge/scripts" = [
  "scripts/install_skills.py",
  "scripts/install_zed_skills.py",
  "scripts/install_codex_skills.py",
  "scripts/build_skill_bundle.py",
]
"share/agent-skill-forge/templates" = [
  "templates/AGENTS.md",
  "templates/AGENTS-AIO.md",
]
"share/agent-skill-forge/skills/quality/adversarial-deep-review" = ["skills/quality/adversarial-deep-review/SKILL.md"]
"share/agent-skill-forge/skills/planning/compatibility-migration" = [
  "skills/planning/compatibility-migration/SKILL.md",
]
